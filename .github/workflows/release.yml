name: Release validation

# Personal releases are installed from pinned GitHub commits, never published
# to npm. Keep package validation on GitHub releases and manual dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false


      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::package.json is $version; run this on tag v$version, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
            exit 1
          fi

      - name: Check package
        run: bash scripts/check-npm-package.sh

